<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="9869.jpg" type="image/x-icon">
    <title>Προτάσεις Τραγουδιών</title>
    <style>
        body { 
        font-family: Aptos; 
        max-width: 100%;
         margin: auto; 
         padding: 20px; 
         background-image: url('9869.jpg');
          background-size:cover; 
        }
        
        #songInput { width: 80%; 
        padding: 10px; 
        background-color: aliceblue;
         }
        #addBtn { 
        padding: 10px; 
        }
        .song-item { padding: 8px; 
        background: #f1f1f1;
         margin-top: 10px; 
         border-radius: 5px; 
         }

        h1 {background-color: rgba(255,255,255,0.2);
         color:aliceblue; 
         border-radius: 15px; 
         text-align: center; 
         }
        h2 {text-align: center; 
        background-color: rgba(255,255,255,0.2); 
        color:aliceblue; 
        }
        song-item { 
            padding: 10px; 
            background: #f1f1f1; 
            margin-top: 10px; 
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            
        }
        #deleteAll {
            margin-top: 20px;
            padding: 10px 15px;
            background: #222;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        
    </style>
</head>
<body>
    <h1>Φέτος προτείνετε εσείς τραγούδια!</h1>
    <input type="text" id="songInput" placeholder="Βάλε τραγούδι">
    <button id="addBtn">Add</button>
    <button id="saveBtn">Save</button>

    <div id="list"></div>
    
 <script>
    const input = document.getElementById("songInput");
    const addBtn = document.getElementById("addBtn");
    const saveBtn = document.getElementById("saveBtn");
    const list = document.getElementById("list");


  window.onload = () => {
    const savedSongs = JSON.parse(localStorage.getItem("songs")) || [];
    savedSongs.forEach(song => addSongToList(song));
  };

  addBtn.onclick = () => {
    if (input.value.trim() === "") return;
    addSongToList(input.value);
    input.value = "";
  };

  saveBtn.onclick = () => {
    const songs = [];
    document.querySelectorAll(".song-item span").forEach(span => {
        songs.push(span.textContent);
    });

    localStorage.setItem("songs", JSON.stringify(songs));
    alert("Αποθηκεύτηκαν!");
  };

  function addSongToList(songName) {
    const div = document.createElement("div");
    div.className = "song-item";

    const text = document.createElement("span");
    text.textContent = songName;

    const delBtn = document.createElement("button");
    delBtn.textContent = "Delete";
    delBtn.className = "delete-btn";

    delBtn.onclick = () => {
        div.remove();
    };

    div.appendChild(text);
    div.appendChild(delBtn);
    list.appendChild(div);
  }



 </script>




</body>
</html>
