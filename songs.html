<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="9869.jpg" type="image/x-icon">
    <title>Προτάσεις Τραγουδιών</title>
    <style>
        body { font-family: Aptos; max-width: 600px; margin: auto; padding: 20px; background-image: url('9869.jpg'); background-size:cover; }
        #songInput { width: 80%; padding: 10px; background-color: aliceblue; }
        #addBtn { padding: 10px; }
        .song-item { padding: 8px; background: #f1f1f1; margin-top: 10px; border-radius: 5px; }
        h1 {background-color: rgba(255,255,255,0.2); color:aliceblue; border-radius: 15px; text-align: center; }
        h2 {text-align: center; background-color: rgba(255,255,255,0.2); color:aliceblue; }
        song-item { 
            padding: 10px; 
            background: #f1f1f1; 
            margin-top: 10px; 
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            
        }
        #deleteAll {
            margin-top: 20px;
            padding: 10px 15px;
            background: #222;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        
    </style>
</head>
<body>
    <h1>Φέτος προτείνετε εσείς τραγούδια!</h1>
    <input type="text" id="songInput" placeholder="Π.χ. Giorgos Mazonakis - To Gucci φόρεμα">
    <button id="addBtn">Προσθήκη</button>
    <br><br><br><br>

    <h2>Λίστα αναμονής:</h2>
    <div id="songList"></div>

    <script>
    const input = document.getElementById('songInput');
    const list = document.getElementById('songList');
    const deleteAllBtn = document.getElementById('deleteAll'); // το κουμπί delete all

    
    document.getElementById('addBtn').onclick = () => {
        if (input.value.trim() === "") return;

        const div = document.createElement("div");
        div.className = "song-item";

       
        const text = document.createElement("span");
        text.textContent = input.value;

        
        const delBtn = document.createElement("button");
        delBtn.textContent = "Delete";
        delBtn.className = "delete-btn";

        delBtn.onclick = () => {
            div.remove(); 
        };

        
        div.appendChild(text);
        div.appendChild(delBtn);

        
        list.appendChild(div);

        input.value = "";
    };

   
    deleteAllBtn.onclick = () => {
        list.innerHTML = "";
    };
</script>




</body>
</html>
